# T6.1 ADIM 2/2, S6.1 — hedefle uyumlu derleme/kontroller.
#
# GitHub Actions ile hedef Linux/CPU/Node uyumlu üretim derlemesi ve test;
# SSH üzerinden sürümlü çıktı ile manuel tetiklenen kontrollü yayın.
# Production'a her push'ta otomatik yayın yoktur. Özel repoda Actions
# dakika ve artifact depolama kotaları sınırlıdır. GitHub Actions, hedef
# Ubuntu/Linux CPU mimarisi ve Node sürümüyle uyumlu üretim çıktısını
# hazırlar; better-sqlite3 ve Argon2 native modülleri hedefte sınanır.
# S6.1 AC1–AC7 kabul kriterlerinin tümü bağlayıcıdır.
#
# Bu iş akışı yalnız DOĞRULAMA yapar (test/derleme/yayın çıktısı üretimi +
# artifact); GERÇEK sunucuya SSH ile yayın YOKTUR (S6.1 AC7, T6.2/T6.5
# kapsamı) ve HİÇBİR GitHub secret'ı KULLANILMAZ — bu depo henüz hiçbir
# secret tanımlamadı (K9 açık kalan hesap/erişim kararı).
name: CI

on:
  push:
  pull_request:

# Aynı dal/PR referansı için önceki koşuyu iptal eder — Actions dakika
# bütçesi sınırlıdır; art arda push'larda eski, artık anlamsız koşular
# kaynak tüketmeye devam etmez.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# En az yetki: GITHUB_TOKEN varsayılan olarak depo/organizasyon ayarına
# (bazı hesaplarda "read and write") düşebilir; `npm ci` ve
# `npx playwright install` sırasında çalışan üçüncü taraf paket kodu
# (tedarik zinciri riski) bu token'ı kullanabileceğinden açıkça yalnız
# okuma izniyle sınırlanır. `actions/upload-artifact` kendi çalışma
# zamanı token'ını kullanır; GITHUB_TOKEN'da ayrı bir izin GEREKTİRMEZ.
permissions:
  contents: read

jobs:
  verify:
    name: Doğrulama (typecheck/lint/test/build/yayın çıktısı)
    # Hedef sunucu için Ubuntu LTS seçildi (Ubuntu/Linux CPU mimarisi).
    # `ubuntu-24.04` GitHub'ın sabit (rolling olmayan) LTS runner imajıdır;
    # better-sqlite3/argon2 native ikilikleri bu imajda derlenip arşivlenir.
    runs-on: ubuntu-24.04
    # Actions dakika bütçesi sınırlıdır — takılı kalan bir adım (ör.
    # Playwright webServer'ın hiç hazır olmaması) koşuyu sınırsız süre
    # işgal ETMEZ.
    timeout-minutes: 30
    env:
      # Üretim topolojisi ile AYNI şema/host deseni (bkz.
      # playwright.config.ts E2E_APP_ORIGIN üst notu);
      # gerçek bir alan adı/sertifika GEREKTİRMEZ, yalnız "aynı köken"
      # denetiminin (src/server/auth/app-origin.ts) geçmesi için.
      APP_ORIGIN: http://127.0.0.1:3100
      NODE_ENV: test
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # Geçici, bu koşuya özel DB yolu — GERÇEK müşteri veritabanı bu ortamda
      # HİÇ bulunmaz (S6.1 AC6). `runner` bağlamı jobs.<id>.env içinde
      # KULLANILAMAZ (GitHub iş akışını "workflow file issue" ile reddeder);
      # bu yüzden yol, adım düzeyinde $RUNNER_TEMP ile GITHUB_ENV'e yazılır.
      # test:e2e ve release:verify kendi geçici DB yollarını ayrıca kullanır.
      - name: Koşuya özel geçici DB yolu
        run: echo "DOLMUS_DB_PATH=$RUNNER_TEMP/dolmus-ci.sqlite" >> "$GITHUB_ENV"

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıkları kur (lockfile ile sabit)
        run: npm ci

      # typecheck → lint → test:unit → test:integration tek adımda
      # (scripts/lib/quality-gate.ts). Geçerse bu commit'in ağacı için
      # .quality-gate kaydı yazılır; release:build aynı içerik için kapıyı
      # yeniden çalıştırmaz. test:release bu kayda bakmaz, klonuna kendi
      # hazır kaydını yazar.
      - name: Kalite kapısı (typecheck/lint/birim/entegrasyon)
        run: npm run quality-gate

      # release:build/release:verify boru hattının uçtan uca meta-testi ve
      # kontrollü yayın aracının (scripts/release-apply.ts) testleri —
      # rutin test:integration'dan ayrı (bkz. vitest.config.mts `release`
      # projesi); burada ayrı adım olarak koşar.
      - name: Yayın boru hattı testleri (release:build/verify meta-testi + release-apply aracı)
        run: npm run test:release

      - name: Playwright tarayıcısını kur (chromium)
        run: npx playwright install --with-deps chromium

      # Denetim bulgusu (S6.1 düzeltme turu 1, medium — Actions dakika
      # bütçesi): burada ayrıca bir "npm run build" adımı YOKTUR. Bu
      # `test:e2e` adımının kendi komutu ("next build && node scripts/
      # prepare-standalone.ts && playwright test", bkz. package.json) ZATEN
      # tam bir `next build` çalıştırır; araya girecek bir bağımsız "npm
      # run build" adımının çıktısını hiçbir şey TÜKETMEZ (hemen ardından
      # bu adım onu yeniden üretir) — üç kez aynı üretim derlemesini
      # çalıştırıp (build → e2e'nin kendi build'i → release:build'in kendi
      # build'i) Actions dakikasını gereksiz tüketmemek için KALDIRILDI.
      # `release:build`'in KENDİ `next build`'i (aşağıda) BİLEREK
      # KORUNUR: o, yayın arşivine giren `.next/standalone`'ın Playwright
      # koşusundan ARTAKALAN durumla KARIŞMAMASI için KASITLI temiz bir
      # yeniden derlemedir (bkz. scripts/release-build.ts üst notu, AC4).
      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Playwright raporu (yalnız başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Yayın çıktısı + manifest üret
        run: npm run release:build

      - name: Yayın çıktısını temiz ortamda doğrula
        run: npm run release:verify -- dist/*.tar.gz

      - name: Yayın çıktısını artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          # `scripts/release-build.ts` arşivi `dist/<ad>-<sha>-<platform>-
          # <arch>.tar.gz` ve manifest'i yanına `…manifest.json` olarak
          # yazar (bkz. scripts/lib/release-shared.ts `manifestPathFor`);
          # tam dosya adı kaynak commit/mimariye göre DEĞİŞTİĞİNDEN sabit
          # bir "dist/manifest.json" yolu YOKTUR — glob deseni ikisini de
          # (arşiv + manifest) tam adlarıyla yakalar.
          path: |
            dist/*.tar.gz
            dist/*.manifest.json
          retention-days: 14
          if-no-files-found: error
