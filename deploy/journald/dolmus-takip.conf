# /etc/systemd/journald.conf.d/dolmus-takip.conf
# HAZIRLANDI, gerçek sunucuda DENENMEDİ (manuel kurulumda denenecek). docs/SERVER-SETUP.md.
# ARCHITECTURE §8.1/§8.2: servis, sağlık görevi ve Caddy günlükleri journald'da,
# toplam ~200 MB ile sınırlı; reboot sonrası incelenebilsin diye kalıcı depolama.
[Journal]
Storage=persistent
SystemMaxUse=200M
