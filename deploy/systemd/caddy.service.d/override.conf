# /etc/systemd/system/caddy.service.d/override.conf
# HAZIRLANDI, gerçek sunucuda DENENMEDİ (manuel kurulumda denenecek).
# Caddyfile'daki {$DOLMUS_DOMAIN} için alan adı, uygulamayla AYNI dosyadan gelir.
[Unit]
# Uygulama servisiyle aynı yeniden başlatma sınırı.
StartLimitIntervalSec=900
StartLimitBurst=3

[Service]
EnvironmentFile=/etc/dolmus-takip/domain.env
Restart=on-failure
RestartSec=10s
